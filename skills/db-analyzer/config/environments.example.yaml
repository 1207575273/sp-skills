# 数据库分析 skill - 环境配置模板(每个连接一段,新增连接照抄一段改值即可)。
# 复制成同目录 environments.yaml,填自己有权限的库。真实配置不入库(见 .gitignore)。
#
# type 支持: mysql / postgres / oracle / sqlite
# 每个条目直接对应一个具体的库/服务,不是"服务器级连接 + 候选库列表"。
# sqlite 是本地文件,没有 host/port/账号密码,只有 path。

mkdev01-mysql:
  type: mysql
  host: <主机名或IP>
  port: 3306
  database: <库名>
  user: <账号>
  password: <密码>

mkdev01-pg:
  type: postgres
  host: <主机名或IP>
  port: 5432
  database: <库名>
  user: <账号>
  password: <密码>

mkdev01-oracle:
  type: oracle
  host: <主机名或IP>
  port: 1521
  serviceName: <service name,不是 SID>
  user: <账号>
  password: <密码>

local-sqlite:
  type: sqlite
  path: <SQLite 文件的绝对路径,如 /path/to/app.db>
